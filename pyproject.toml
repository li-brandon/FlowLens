[project]
name = "flowlens"
version = "0.1.0"
description = "Local-only cash-flow visualizer: Sankey view, metrics and category drill-down for a transaction CSV."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "plotly==7.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
